services:
  app:
    # build และ push โดย GitHub Actions (.github/workflows/docker-publish.yml)
    # APP_TAG เลือก tag ได้ เช่น sha-abc1234 เพื่อ rollback (ค่าเริ่มต้น latest)
    image: ghcr.io/9nansoft/app-meeting:${APP_TAG:-latest}
    ports:
      # เปิดเฉพาะ localhost — ผู้ใช้ภายนอกเข้าผ่าน Cloudflare Tunnel เท่านั้น
      # (ถ้าเปิดสู่ภายนอกตรง ๆ จะปลอม CF-Connecting-IP ใน security log ได้)
      # ถ้า Tunnel ตั้ง service เป็น IP ของเครื่อง host ให้เปลี่ยนเป็น http://app:3080 หรือกำหนด APP_BIND
      - ${APP_BIND:-127.0.0.1}:${APP_PORT:-3080}:3080
    # ส่งค่าใน .env เป็น environment variable (Docker อ่านไฟล์บน host เอง)
    # แทนการ mount ไฟล์เข้า container — container รันเป็นผู้ใช้ bun (ไม่ใช่ root)
    # จึงอ่าน .env ที่ตั้งสิทธิ์ 600 root ไม่ได้ และไฟล์ secret ไม่ต้องอยู่ใน container
    env_file:
      - .env
    environment:
      # rate limit (login/register/csp-report) ใช้ตัวนับร่วมกันใน Valkey — ถ้า Valkey ล่ม แอปใช้ตัวนับในหน่วยความจำแทน
      REDIS_URL: redis://:${VALKEY_PASSWORD:?ตั้ง VALKEY_PASSWORD ใน .env (สร้างด้วย openssl rand -hex 32)}@valkey:6379
    depends_on:
      - valkey
    restart: always
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/3080"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Valkey (fork ของ Redis ภายใต้ license BSD) — เก็บตัวนับ rate limit เท่านั้น
  # ข้อมูลเป็นของชั่วคราว (มี TTL ทุก key) จึงไม่เปิด persistence และไม่เปิดพอร์ตออก host
  valkey:
    # pin เวอร์ชัน + digest (multi-arch) — 8.1.11 เป็น security release (GHSA-f4q9-j22m-xqq9)
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    restart: unless-stopped
    user: valkey
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?ตั้ง VALKEY_PASSWORD ใน .env (สร้างด้วย openssl rand -hex 32)}
    # เขียนรหัสลงไฟล์ config ตอนเริ่ม (ไม่ส่งเป็น argument ซึ่งจะเห็นได้ใน ps)
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass "%s"\n' "$$VALKEY_PASSWORD" > /tmp/valkey.conf
        unset VALKEY_PASSWORD
        exec valkey-server /tmp/valkey.conf \
          --save "" --appendonly no \
          --maxmemory 64mb --maxmemory-policy volatile-ttl
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    # pin เวอร์ชัน + digest (multi-arch: amd64/arm64) แทน :latest เพื่อให้ deploy ซ้ำได้ผลเหมือนเดิม
    # และไม่ดึง image ใหม่มาใช้โดยไม่ได้ตรวจ — อัปเดตโดยเปลี่ยนทั้ง tag และ digest พร้อมกัน
    # (ดูเวอร์ชัน: https://hub.docker.com/r/cloudflare/cloudflared/tags)
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel run --token ${TUNNEL_TOKEN}
    volumes:
      - ./cloudflared:/etc/cloudflared
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"