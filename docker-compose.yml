services:
  app:
    image: "registry.gitlab.com/phingosoft/es-nuxt:latest"
    ports:
      - ${APP_PORT:-3080}:3080
    volumes:
      - ./.env:/app/.env
    restart: always
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/3080"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  cloudflared:
    # pin เวอร์ชัน + digest (multi-arch: amd64/arm64) แทน :latest เพื่อให้ deploy ซ้ำได้ผลเหมือนเดิม
    # และไม่ดึง image ใหม่มาใช้โดยไม่ได้ตรวจ — อัปเดตโดยเปลี่ยนทั้ง tag และ digest พร้อมกัน
    # (ดูเวอร์ชัน: https://hub.docker.com/r/cloudflare/cloudflared/tags)
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel run --token ${TUNNEL_TOKEN}
    volumes:
      - ./cloudflared:/etc/cloudflared
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"