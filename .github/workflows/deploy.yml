# Deploy ไปที่เครื่อง production ผ่าน SSH (แทน job deploy_production ของ GitLab CI เดิม)
#
# สั่งรันเอง: Actions → "Deploy production" → Run workflow (เลือก tag ได้ ค่าเริ่มต้น latest)
#
# ตั้งค่าใน Settings → Secrets and variables → Actions:
#   secrets:   SSH_PRIVATE_KEY   private key ของผู้ใช้ deploy บนเครื่อง production
#              SSH_KNOWN_HOSTS   ผลของ `ssh-keyscan -H <host>` (กัน man-in-the-middle)
#   variables: SSH_HOST, SSH_USER, DEPLOY_PATH (โฟลเดอร์ที่มี docker-compose.yml และ .env)
# และแนะนำ Settings → Environments → production → Required reviewers ให้ต้องอนุมัติก่อน deploy
#
# image บน ghcr.io เป็น private ตาม repo — job นี้ login ให้เครื่อง production ด้วย GITHUB_TOKEN
# (หมดอายุเมื่อ job จบ) ส่งผ่าน stdin ไม่อยู่ใน command line แล้ว logout หลัง pull เสร็จ
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag ที่จะ deploy (latest, sha-xxxxxxx หรือเวอร์ชัน)"
        required: true
        default: latest

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      APP_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$APP_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "::error::invalid tag: $APP_TAG"; exit 1; }
          for v in SSH_HOST SSH_USER DEPLOY_PATH; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is not set"; exit 1; }
          done
          [[ "$DEPLOY_PATH" =~ ^[A-Za-z0-9._/~-]+$ ]] || { echo "::error::invalid DEPLOY_PATH"; exit 1; }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_PRIVATE_KEY / SSH_KNOWN_HOSTS secrets are not set"; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull image and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh_run() { ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$SSH_HOST" "$@"; }
          printf '%s' "$GHCR_TOKEN" | ssh_run "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          trap 'ssh_run "docker logout ghcr.io" || true' EXIT
          ssh_run "cd '$DEPLOY_PATH' && APP_TAG='$APP_TAG' docker compose pull app && APP_TAG='$APP_TAG' docker compose up -d --remove-orphans && docker image prune -f"
          ssh_run "cd '$DEPLOY_PATH' && docker compose ps"
