# Dependabot — ตรวจและเปิด PR อัปเกรด dependency อัตโนมัติ
# เอกสาร: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# - version updates: รายสัปดาห์ (จันทร์ 06:00 น. เวลาไทย) และมี cooldown ไม่หยิบเวอร์ชันที่เพิ่งออก
#   ลดความเสี่ยงจากแพ็กเกจที่ถูกยึด/ปล่อยผิดพลาด (supply-chain) และให้เวลาชุมชนเจอบั๊กก่อน
# - security updates: ไม่ติด cooldown — เปิดใช้ที่ Settings → Code security → Dependabot security updates
# - minor/patch รวมเป็น PR เดียวต่อกลุ่ม (production / development) ส่วน major แยก PR ละตัวเพื่อรีวิวทีละเรื่อง
version: 2
updates:
  # ---------- JavaScript (Bun: package.json + bun.lock) ----------
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      production-minor-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # รวม security update หลายตัวไว้ใน PR เดียว
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      # @vee-validate/zod และ shadcn-vue ยังรองรับแค่ zod 3 — อัปเป็น zod 4 เมื่อทั้งสองรองรับแล้ว
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (คอมไพเลอร์ที่เขียนใหม่) ยังใช้กับ vue-tsc / @vue/compiler-sfc ไม่ได้ — build ล้ม (ดู #14)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # ---------- Base image ใน Dockerfile (oven/bun) ----------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Bangkok"
    # Dependabot แยก security release ของ image ไม่ได้ (ไม่มี advisory ให้) — cooldown สั้นเพื่อไม่หน่วงแพตช์ความปลอดภัย
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(docker)"

  # ---------- Image ใน docker-compose.yml (cloudflared) ----------
  # ถ้า pin ด้วย tag@digest Dependabot จะอัปเดตทั้ง tag และ digest ให้
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Bangkok"
    # cooldown สั้น: เดิม 14 วันทำให้ได้ valkey 9.1.2 ซึ่งยังไม่มีแพตช์ GHSA-f4q9 แทน 9.1.3 (ดู #10)
    cooldown:
      default-days: 3
    ignore:
      # image ของแอปเอง (สร้างจาก GitLab CI) — ไม่ต้องให้ Dependabot ดูแล
      - dependency-name: "registry.gitlab.com/phingosoft/es-nuxt"
      # อยู่สาย Valkey 8.1 (ยังได้ security patch) — ย้ายไป major ใหม่อย่างตั้งใจพร้อมทดสอบ ไม่ให้เสนออัตโนมัติ
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deploy)"
